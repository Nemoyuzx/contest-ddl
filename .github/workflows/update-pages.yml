name: Daily update and Pages

on:
  schedule:
    - cron: "17 0 * * *" # 08:17 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: contest-ddl-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Collect and validate data
        run: |
          python -m contestddl update
          python -m pytest
      - name: Commit refreshed artifacts
        run: |
          git config user.name "contest-ddl-bot"
          git config user.email "contest-ddl-bot@users.noreply.github.com"
          git add -- data/competitions.json data/competitions.ics data/quality-report.json data/source-status.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): daily refresh [skip ci]"
            git push
          fi
      - name: Build static artifact
        run: |
          mkdir -p _site
          cp index.html 404.html _site/
          cp -R assets data docs _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
